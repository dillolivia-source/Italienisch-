<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#2e7d32" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Italienisch" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="styles.css" />
<title>Olivias Italienisch-Trainer</title>

<div id="app">
  <header class="topbar">
    <h1><span class="flag" aria-hidden="true"></span> Italienisch</h1>
    <button id="reset-btn" class="icon-btn" title="Fortschritt zurücksetzen" hidden>↺</button>
  </header>

  <main id="view"><!-- Views werden hier gerendert --></main>

  <nav class="tabbar" role="tablist">
    <button class="tab" data-view="uebersetzen" aria-selected="true">
      <span class="tab-ico">✍️</span><span class="tab-lbl">Übersetzen</span>
    </button>
    <button class="tab" data-view="quiz" aria-selected="false">
      <span class="tab-ico">🎯</span><span class="tab-lbl">Stolper-Quiz</span>
    </button>
    <button class="tab" data-view="karten" aria-selected="false">
      <span class="tab-ico">📇</span><span class="tab-lbl">Karten</span>
    </button>
    <button class="tab" data-view="fortschritt" aria-selected="false">
      <span class="tab-ico">📊</span><span class="tab-lbl">Fortschritt</span>
    </button>
  </nav>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
